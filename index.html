              { label: "熊本站地圖", url: "https://www.google.com/maps/search/?api=1&query=熊本站" }
            ]
          },
          {
            time: "中午至下午｜熊本散策",
            title: "熊本城・櫻之馬場 城彩苑",
            description: "參觀熊本城，並到城彩苑品嚐熊本在地美食、採買伴手禮。時間允許可再到市中心商店街走走。",
            tags: ["熊本城", "城彩苑", "在地美食"],
            image: "https://images.unsplash.com/photo-1528360983277-13d401cdc186?auto=format&fit=crop&w=900&q=80",
            links: [
              { label: "熊本城官網", url: "https://castle.kumamoto-guide.jp/" },
              { label: "城彩苑官網", url: "https://josaien.kumamoto.jp/" }
            ]
          },
          {
            time: "傍晚｜前往機場",
            title: "取回行李・搭車前往熊本機場",
            description: "回熊本站取行李，搭乘機場巴士或預先安排的交通前往熊本機場，辦理登機手續，搭機返家。",
            tags: ["熊本機場", "返程", "預留交通時間"],
            image: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=900&q=80",
            links: [
              { label: "熊本機場交通資訊", url: "https://www.kumamoto-airport.co.jp/en/access/" },
              { label: "熊本機場位置", url: "https://www.google.com/maps/search/?api=1&query=阿蘇熊本機場" }
            ]
          }
        ]
      }
    ];

    const tabsEl = document.getElementById("dayTabs");
    const itineraryEl = document.getElementById("itinerary");

    function render() {
      tabsEl.innerHTML = "";
      itineraryEl.innerHTML = "";

      DAYS.forEach((day, index) => {
        const button = document.createElement("button");
        button.className = "tab" + (index === 0 ? " active" : "");
        button.textContent = day.tab;
        button.type = "button";
        button.setAttribute("aria-selected", index === 0 ? "true" : "false");
        button.addEventListener("click", () => selectDay(index));
        tabsEl.appendChild(button);

        const panel = document.createElement("section");
        panel.className = "day-panel" + (index === 0 ? " active" : "");
        panel.id = `day-${index}`;
        panel.innerHTML = `
          <div class="day-heading">
            <div>
              <div class="day-no">${day.tab.toUpperCase()}　／　${day.date}</div>
              <h2>${day.title}</h2>
            </div>
            <p>${day.subtitle}</p>
          </div>
          ${day.note ? `<div class="day-note">✦ ${day.note}</div>` : ""}
          <div class="timeline">
            ${day.activities.map(activity => `
              <article class="trip-card">
                <img src="${activity.image}" alt="${activity.title}" loading="lazy"
                  onerror="this.style.display='none'">
                <div class="trip-content">
                  <div class="trip-time">${activity.time || ""}</div>
                  <h3>${activity.title}</h3>
                  <p>${activity.description}</p>
                  <div class="chips">${(activity.tags || []).map(tag => `<span class="chip">${tag}</span>`).join("")}</div>
                  <div class="card-links">
                    ${(activity.links || []).map(link => `<a href="${link.url}" target="_blank" rel="noopener noreferrer">${link.label} ↗</a>`).join("")}
                  </div>
                </div>
              </article>
            `).join("")}
          </div>
        `;
        itineraryEl.appendChild(panel);
      });
    }

    function selectDay(index) {
      document.querySelectorAll(".tab").forEach((tab, i) => {
        tab.classList.toggle("active", i === index);
        tab.setAttribute("aria-selected", i === index ? "true" : "false");
      });
      document.querySelectorAll(".day-panel").forEach((panel, i) => {
        panel.classList.toggle("active", i === index);
      });
      document.querySelector(".tabs-wrap").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    render();
  </script>
</body>
</html>
